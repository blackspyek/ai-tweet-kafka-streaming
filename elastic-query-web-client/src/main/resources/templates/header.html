<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Twitter Search Engine</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body id="query-client"
      class="min-h-screen bg-slate-950 text-slate-100">

<nav th:fragment="header"
     class="border-b border-slate-800 bg-slate-900/90 shadow-lg">

    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">

        <div class="flex items-center gap-8">

            <a th:href="@{/}"
               class="text-xl font-bold tracking-tight text-white hover:text-blue-400 transition">
                Twitter Search
            </a>

            <div class="flex items-center gap-2">

                <a th:href="@{/}"
                   class="rounded-lg px-4 py-2 text-sm font-medium text-slate-300
                          hover:bg-slate-800 hover:text-white transition">
                    Main page
                </a>

                <a th:if="${#authorization.expression('isAuthenticated()')}"
                   th:href="@{/home}"
                   class="rounded-lg px-4 py-2 text-sm font-medium text-slate-300
                          hover:bg-slate-800 hover:text-white transition">
                    Search page
                </a>

            </div>
        </div>

        <div class="flex items-center gap-4">

            <div th:if="${#authorization.expression('isAuthenticated()')}"
                 class="flex items-center gap-4">

                <div class="text-sm text-slate-400">
                    Welcome,
                    <span th:text="${#authentication.principal.fullName}"
                          class="font-semibold text-white">
                        username
                    </span>
                </div>

                <form method="post"
                      th:action="@{/logout}">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <button type="submit"
                            class="rounded-lg bg-red-600 px-4 py-2 text-sm font-semibold text-white
                                   shadow-sm transition
                                   hover:bg-red-500
                                   focus:outline-none
                                   focus:ring-2
                                   focus:ring-red-500
                                   focus:ring-offset-2
                                   focus:ring-offset-slate-900">
                        Logout
                    </button>

                </form>

            </div>

            <form th:unless="${#authorization.expression('isAuthenticated()')}"
                  method="get"
                  th:action="@{/home}">

                <button type="submit"
                        class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white
                               shadow-sm transition
                               hover:bg-blue-500
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500
                               focus:ring-offset-2
                               focus:ring-offset-slate-900">
                    Login
                </button>

            </form>

        </div>

    </div>
</nav>
