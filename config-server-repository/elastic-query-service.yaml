elastic-query-service:
  version: v1
  custom-audience: elastic-query-service

  webclient:
    connect-timeout-ms: 10000
    read-timeout-ms: 10000
    write-timeout-ms: 10000
    max-in-memory-size: 10485760
    content-type: application/json
    accept-type: application/json
    query-type: KAFKA_STATE_STORE

  query-from-kafka-state-store:
    method: GET
    uri: http://localhost:8187/kafka-streams-service/get-word-count-by-word/{word}
    accept: ${elastic-query-service.webclient.accept-type}
server:
  port: 8103
  servlet:
    context-path: /elastic-query-service
spring:

  jpa:
    open-in-view: false
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=public
    username: keycloak
    password: keycloak
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      platform: postgres
      schema-locations: classpath:init-schema.sql
      data-locations: classpath:init-data.sql
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9091/realms/microservices-realm
          jwk-set-uri: http://localhost:9091/realms/microservices-realm/protocol/openid-connect/certs

      client:
        registration:
          keycloak:
            client-id: elastic-query-service
            client-secret: ${ELASTIC_QUERY_SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials

        provider:
          keycloak:
            issuer-uri: http://localhost:9091/realms/microservices-realm
elastic-query-config:
  text-field: text

elastic-config:
  index-name: twitter-index
  connection-url: localhost:9200
  connect-timeout-ms: 5000
  socket-timeout-ms: 30000
  is-repository: true

user-config:
  username: test
  password: test
  roles: USER

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
security:
  paths-to-ignore: /api-docs