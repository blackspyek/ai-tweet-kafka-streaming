services:
  ai-generated-tweet-to-kafka-service:
    image: ai-generated-tweet-to-kafka-service:${SERVICE_VERSION:-latest}
    depends_on:
      - config-server
      - kafka-broker-1
      - kafka-broker-2
      - kafka-broker-3
    restart: "on-failure:10"
    ports:
      - "5005:5005"
    volumes:
      - "./docker-logs:/workspace/ai-generated-tweet-to-kafka-service/logs"
    environment:
      - "JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -Xms128m -Xmx256m"
      - "LOGGING_LEVEL_COM_MICROSERVICES_DEMO=info"
      - "LOGGING_LEVEL_ROOT=info"
      - "KAFKA_CONFIG_TOPIC_NAME=twitter-topic"
      - "KAFKA_CONFIG_TOPIC_NAMES_TO_CREATE_0=twitter-topic"
      - "KAFKA_CONFIG_TOPIC_NAMES_TO_CREATE_1=twitter-analytics-topic"
      - "KAFKA_CONFIG_BOOTSTRAP_SERVERS=kafka-broker-1:19092,kafka-broker-2:19092,kafka-broker-3:19092"
      - "KAFKA_CONFIG_SCHEMA_REGISTRY_URL=http://schema-registry:8081"
      - "SPRING_AI_OLLAMA_BASE_URL=http://host.docker.internal:11434"
      - "CONFIG_SERVER_URL=http://config-server:8888"
      - "SPRING_CLOUD_CONFIG_USERNAME=spring_cloud_user"
      - "SPRING_CLOUD_CONFIG_PASSWORD=test"
    networks:
      - ${GLOBAL_NETWORK:-application}
  kafka-to-elastic-service:
    image: kafka-to-elastic-service:${SERVICE_VERSION:-latest}
    ports:
      - "5006:5006"
    volumes:
      - "./docker-logs:/workspace/kafka-to-elastic-service/logs"
    user: root
    restart: "on-failure:10"
    depends_on:
      config-server:
        condition: service_started

      ai-generated-tweet-to-kafka-service:
        condition: service_started

      kafka-broker-1:
        condition: service_started

      kafka-broker-2:
        condition: service_started

      kafka-broker-3:
        condition: service_started

      elastic-1:
        condition: service_started

      elastic-2:
        condition: service_started

      elastic-3:
        condition: service_started
    environment:
      - "JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006 -Xms128m -Xmx256m"
      - "LOGGING_LEVEL_COM_MICROSERVICES_DEMO=debug"
      - "LOGGING_LEVEL_ROOT=debug"
      - "KAFKA_CONFIG_TOPIC_NAME=twitter-topic"
      - "KAFKA_CONFIG_BOOTSTRAP_SERVERS=kafka-broker-1:19092,kafka-broker-2:19092,kafka-broker-3:19092"
      - "KAFKA_CONFIG_SCHEMA_REGISTRY_URL=http://schema-registry:8081"
      - "CONFIG_SERVER_URL=http://config-server:8888"
      - "SPRING_CLOUD_CONFIG_USERNAME=spring_cloud_user"
      - "SPRING_CLOUD_CONFIG_PASSWORD=test"
      - "ELASTIC_CONFIG_INDEX_NAME=twitter-index"
      - "ELASTIC_CONFIG_CONNECTION_URL=elastic-1:9200"
      - "ENCRYPT_KEY=${ENCRYPT_KEY}"
    networks:
      - ${GLOBAL_NETWORK:-services}
  config-server:
    image: config-server:${SERVICE_VERSION:-latest}
    ports:
      - "8888:8888"
      - "5007:5007"
    volumes:
      - "./docker-logs:/workspace/config-server/logs"
      - "../config-server-repository:/config-server-repository"
    environment:
      - "JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006 -Xms128m -Xmx256m"
      - "ENCRYPT_KEY=${ENCRYPT_KEY}"
      - "CONFIG_REPO_URI=file:/config-server-repository"
    networks:
      - ${GLOBAL_NETWORK:-application}

  discovery-service-1:
    image: discovery-service:${SERVICE_VERSION:-latest}
    ports:
      - "5014:5014"
      - "8761:8761"
    restart: "on-failure:10"
    environment:
      - "JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5014 -Xms128m -Xmx256m"
      - "SPRING_PROFILES_ACTIVE=peer1"
    networks:
      - ${GLOBAL_NETWORK:-application}

  discovery-service-2:
    image: discovery-service:${SERVICE_VERSION:-latest}
    ports:
      - "5015:5015"
      - "8762:8762"
    restart: "on-failure:10"
    environment:
      - "JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5015 -Xms128m -Xmx256m"
      - "SPRING_PROFILES_ACTIVE=peer2"
    networks:
      - ${GLOBAL_NETWORK:-application}

  elastic-query-service-1:
    image: elastic.query.service:${SERVICE_VERSION:-latest}
    ports:
      - "5008:5008"
      - "8183:8183"
    restart: "on-failure:10"
    volumes:
      - "./docker-logs:/workspace/elastic-query-service/logs"
    depends_on:
      - discovery-service-1
      - discovery-service-2
      - kafka-to-elastic-service
      - elastic-1
      - elastic-2
      - elastic-3
    environment:
      - "JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5008 -Xms128m -Xmx256m"
      - "LOGGING_LEVEL_COM_MICROSERVICES_DEMO=debug"
      - "LOGGING_LEVEL_ROOT=debug"
      - "ELASTIC_CONFIG_INDEX_NAME=twitter-index"
      - "ELASTIC_CONFIG_CONNECTION_URL=elastic-1:9200"
      - "SERVER_PORT=8183"
      - "SERVER_SERVLET_CONTEXT_PATH=/elastic-query-service"
      - "SPRING_CLOUD_CONFIG_URI=http://config-server:8888"
      - "ENCRYPT_KEY=${ENCRYPT_KEY}"
      - "CONFIG_SERVER_URL=http://config-server:8888"
      - "SPRING_CLOUD_CONFIG_USERNAME=spring_cloud_user"
      - "SPRING_CLOUD_CONFIG_PASSWORD=test"
      - "EUREKA_SERVICE_URL=http://discovery-service-1:8761/eureka/,http://discovery-service-2:8762/eureka/"
      - "SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/postgres?currentSchema=public&binaryTransfer=true&reWriteBatchedInserts=true"
      - "SPRING_DATASOURCE_USERNAME=keycloak"
      - "SPRING_DATASOURCE_PASSWORD=keycloak"
      - "SPRING_SQL_INIT_MODE=never"
      - "SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak-authorization-server:9091/realms/microservices-realm"
      - "SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak-authorization-server:9091/realms/microservices-realm/protocol/openid-connect/certs"
      - "SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI=http://keycloak-authorization-server:9091/realms/microservices-realm/protocol/openid-connect/token"
      - "ELASTIC_QUERY_SERVICE_QUERY_FROM_KAFKA_STATE_STORE_URI=http://kafka-streams-service/kafka-streams-service/get-word-count-by-word/{word}"
      - "ELASTIC_QUERY_SERVICE_QUERY_FROM_ANALYTICS_DATABASE_URI=http://analytics-service/analytics-service/get-word-count-by-word/{word}"
      - "ELASTIC_QUERY_SERVICE_WEBCLIENT_QUERY_TYPE=ANALYTICS_DATABASE"
      - "SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI=http://keycloak-authorization-server:9091/realms/microservices-realm"
      - "SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET=${ELASTIC_QUERY_SERVICE_CLIENT_SECRET}"
    networks:
      - ${GLOBAL_NETWORK:-services}
  elastic-query-service-2:
    image: elastic.query.service:${SERVICE_VERSION:-latest}
    ports:
      - "5009:5009"
      - "8186:8186"
    restart: "on-failure:10"
    volumes:
      - "./docker-logs:/workspace/elastic-query-service/logs"
    depends_on:
      - discovery-service-1
      - discovery-service-2
      - kafka-to-elastic-service
      - elastic-1
      - elastic-2
      - elastic-3
    environment:
      - "JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5009 -Xms128m -Xmx256m"
      - "LOGGING_LEVEL_COM_MICROSERVICES_DEMO=debug"
      - "LOGGING_LEVEL_ROOT=debug"
      - "ELASTIC_CONFIG_INDEX_NAME=twitter-index"
      - "ELASTIC_CONFIG_CONNECTION_URL=elastic-1:9200"
      - "SERVER_PORT=8186"
      - "SERVER_SERVLET_CONTEXT_PATH=/elastic-query-service"
      - "SPRING_CLOUD_CONFIG_URI=http://config-server:8888"
      - "ENCRYPT_KEY=${ENCRYPT_KEY}"
      - "CONFIG_SERVER_URL=http://config-server:8888"
      - "SPRING_CLOUD_CONFIG_USERNAME=spring_cloud_user"
      - "SPRING_CLOUD_CONFIG_PASSWORD=test"
      - "EUREKA_SERVICE_URL=http://discovery-service-1:8761/eureka/,http://discovery-service-2:8762/eureka/"
      - "SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/postgres?currentSchema=public&binaryTransfer=true&reWriteBatchedInserts=true"
      - "SPRING_DATASOURCE_USERNAME=keycloak"
      - "SPRING_DATASOURCE_PASSWORD=keycloak"
      - "SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak-authorization-server:9091/realms/microservices-realm"
      - "SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak-authorization-server:9091/realms/microservices-realm/protocol/openid-connect/certs"
      - "SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI=http://keycloak-authorization-server:9091/realms/microservices-realm/protocol/openid-connect/token"
      - "ELASTIC_QUERY_SERVICE_QUERY_FROM_KAFKA_STATE_STORE_URI=http://kafka-streams-service/kafka-streams-service/get-word-count-by-word/{word}"
      - "ELASTIC_QUERY_SERVICE_QUERY_FROM_ANALYTICS_DATABASE_URI=http://analytics-service/analytics-service/get-word-count-by-word/{word}"
      - "ELASTIC_QUERY_SERVICE_WEBCLIENT_QUERY_TYPE=ANALYTICS_DATABASE"
      - "SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI=http://keycloak-authorization-server:9091/realms/microservices-realm"
      - "SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET=${ELASTIC_QUERY_SERVICE_CLIENT_SECRET}"
    networks:
      - ${GLOBAL_NETWORK:-services}
  elastic-query-web-client:
    image: elastic-query-web-client:${SERVICE_VERSION:-latest}
    ports:
      - "5010:5010"
      - "8184:8184"
    volumes:
      - "./docker-logs:/workspace/elastic-query-web-client/logs"
      - "./check-config-server-started.sh:/usr/local/bin/check-config-server-started.sh"
    user: root
    restart: "on-failure:10"
    depends_on:
      - config-server
      - keycloak-authorization-server
      - discovery-service-1
      - discovery-service-2
    environment:
      - "JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5010 -Xms128m -Xmx256m"
      - "LOGGING_LEVEL_COM_MICROSERVICES_DEMO=info"
      - "LOGGING_LEVEL_ROOT=info"
      - "SERVER_PORT=8184"
      - "SERVER_SERVLET_CONTEXT_PATH=/elastic-query-web-client"
      - "SPRING_CLOUD_CONFIG_URI=http://config-server:8888"
      - "CONFIG_SERVER_URL=http://config-server:8888"
      - "SPRING_CLOUD_CONFIG_USERNAME=spring_cloud_user"
      - "SPRING_CLOUD_CONFIG_PASSWORD=test"
      - "EUREKA_SERVICE_URL=http://discovery-service-1:8761/eureka/,http://discovery-service-2:8762/eureka/"
      - "ELASTIC_QUERY_WEB_CLIENT_WEB_CLIENT_BASE_URL=http://elastic-query-service/elastic-query-service/documents"
      - "ENCRYPT_KEY=${ENCRYPT_KEY}"
      - "SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI=http://keycloak-authorization-server:9091/realms/microservices-realm"
      - "SECURITY_LOGOUT_SUCCESS_URL=http://elastic-query-web-client:8184/elastic-query-web-client"
    networks:
      - ${GLOBAL_NETWORK:-services}
  kafka-streams-service:
    image: kafka-streams-service:${SERVICE_VERSION:-latest}
    ports:
      - "5012:5012"
      - "8187:8187"

    volumes:
      - "./docker-logs:/workspace/kafka-streams-service/logs"
      - "./check-config-server-started.sh:/usr/local/bin/check-config-server-started.sh"
      - "./check-keycloak-server-started.sh:/usr/local/bin/check-keycloak-server-started.sh"

    user: root
    restart: "on-failure:10"

    depends_on:
      - config-server
      - keycloak-authorization-server
      - discovery-service-1
      - discovery-service-2
      - kafka-broker-1
      - kafka-broker-2
      - kafka-broker-3
      - schema-registry

    environment:
      - "JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5012 -Xms128m -Xmx256m"
      - "LOGGING_LEVEL_COM_MICROSERVICES_DEMO=debug"
      - "LOGGING_LEVEL_ROOT=info"

      - "CONFIG_SERVER_URL=http://config-server:8888"
      - "SPRING_CLOUD_CONFIG_USERNAME=spring_cloud_user"
      - "SPRING_CLOUD_CONFIG_PASSWORD=test"
      - "EUREKA_SERVICE_URL=http://discovery-service-1:8761/eureka/,http://discovery-service-2:8762/eureka/"

      - "SERVER_PORT=8187"
      - "SERVER_SERVLET_CONTEXT_PATH=/kafka-streams-service"

      - "SPRING_CLOUD_CONFIG_URI=http://config-server:8888"

      - "SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak-authorization-server:9091/realms/microservices-realm"
      - "SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak-authorization-server:9091/realms/microservices-realm/protocol/openid-connect/certs"

      - "KAFKA_CONFIG_BOOTSTRAP_SERVERS=kafka-broker-1:19092,kafka-broker-2:19092,kafka-broker-3:19092"
      - "KAFKA_CONFIG_SCHEMA_REGISTRY_URL=http://schema-registry:8081"

      - "ENCRYPT_KEY=${ENCRYPT_KEY}"

    networks:
      - ${GLOBAL_NETWORK:-services}
  analytics-service:
    image: analytics-service:${SERVICE_VERSION:-latest}
    ports:
      - "5013:5013"
      - "8188:8188"

    volumes:
      - "./docker-logs:/workspace/analytics-service/logs"

    restart: "on-failure:10"

    depends_on:
      - config-server
      - keycloak-authorization-server
      - discovery-service-1
      - discovery-service-2
      - postgres
      - kafka-broker-1
      - kafka-broker-2
      - kafka-broker-3
      - schema-registry

    environment:
      - "JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5013 -Xms128m -Xmx256m"

      - "LOGGING_LEVEL_COM_MICROSERVICES_DEMO=debug"
      - "LOGGING_LEVEL_ROOT=info"

      - "SERVER_PORT=8188"
      - "SERVER_SERVLET_CONTEXT_PATH=/analytics-service"

      - "CONFIG_SERVER_URL=http://config-server:8888"
      - "SPRING_CLOUD_CONFIG_USERNAME=spring_cloud_user"
      - "SPRING_CLOUD_CONFIG_PASSWORD=test"
      - "EUREKA_SERVICE_URL=http://discovery-service-1:8761/eureka/,http://discovery-service-2:8762/eureka/"

      - "SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak-authorization-server:9091/realms/microservices-realm"
      - "SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak-authorization-server:9091/realms/microservices-realm/protocol/openid-connect/certs"

      - "SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/postgres?currentSchema=analytics&binaryTransfer=true&reWriteBatchedInserts=true"
      - "SPRING_DATASOURCE_USERNAME=keycloak"
      - "SPRING_DATASOURCE_PASSWORD=keycloak"

      - "SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect"
      - "SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect"

      - "KAFKA_CONFIG_BOOTSTRAP_SERVERS=kafka-broker-1:19092,kafka-broker-2:19092,kafka-broker-3:19092"
      - "KAFKA_CONFIG_SCHEMA_REGISTRY_URL=http://schema-registry:8081"
      - "KAFKA_CONFIG_TOPIC_NAME=twitter-analytics-topic"

      - "ENCRYPT_KEY=${ENCRYPT_KEY}"

    networks:
      - ${GLOBAL_NETWORK:-application}
